name: Daily Podcast Generator

on:
  schedule:
    # 每天 UTC 00:15 (台灣時間 08:15) 自動執行
    - cron: '15 0 * * *'
  workflow_dispatch:

# 給予上傳檔案回儲存庫的權限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts feedgen pytz

      - name: Run main script
        # 這裡會讀取你在 Secrets 設好的密碼，丟給 main.py 使用
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python main.py

      - name: Commit and push changes
        # 把產生的 mp3 和 feed.xml 自動上傳
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.mp3 feed.xml
          # 如果沒有新信件(沒有產生新檔案)，git commit 會失敗，所以加上 || echo
          git commit -m "Auto update podcast feed" || echo "No changes to commit"
          git push
